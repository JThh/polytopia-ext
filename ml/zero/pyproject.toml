[project]
name = "polyzero"
version = "0.1.0"
description = "Learn to play The Battle of Polytopia by search and self-play: Gumbel AlphaZero with a small network"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",     # CPU, CUDA or Apple-silicon (mps) builds all work
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["polyzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end training smoke test (CPU, about a minute)"]
